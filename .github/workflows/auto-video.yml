name: AI PINTAR Auto Video

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *" # 14:17 WIB

permissions:
  contents: read

concurrency:
  group: ai-pintar-daily-publish
  cancel-in-progress: false

jobs:
  build-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pulihkan riwayat footage Pixabay
        uses: actions/cache@v4
        with:
          path: .cache/pixabay-history.json
          key: pixabay-history-${{ github.run_id }}
          restore-keys: |
            pixabay-history-

      - name: Pasang FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Pasang library Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Buat video dan caption
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python main.py
          test -s output/ai_pintar_video.mp4
          test -s output/caption.txt

      - name: Simpan salinan MP4 dan caption
        uses: actions/upload-artifact@v4
        with:
          name: AI-PINTAR-${{ github.run_number }}
          path: |
            output/ai_pintar_video.mp4
            output/caption.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload video ke Cloudinary dan jadwalkan Facebook serta TikTok melalui Buffer
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          import requests

          required = [
              "CLOUDINARY_CLOUD_NAME",
              "CLOUDINARY_API_KEY",
              "CLOUDINARY_API_SECRET",
              "BUFFER_ACCESS_TOKEN",
          ]
          missing = [key for key in required if not os.getenv(key)]
          if missing:
              sys.exit("Secret belum diisi: " + ", ".join(missing))

          video_path = Path("output/ai_pintar_video.mp4")
          caption = Path("output/caption.txt").read_text(encoding="utf-8").strip()
          if not caption:
              sys.exit("caption.txt kosong; penjadwalan dibatalkan.")

          # Unggah MP4 ke Cloudinary agar Buffer menerima URL video publik.
          cloud = os.environ["CLOUDINARY_CLOUD_NAME"]
          upload_url = f"https://api.cloudinary.com/v1_1/{cloud}/video/upload"
          with video_path.open("rb") as file:
              upload = requests.post(
                  upload_url,
                  auth=(
                      os.environ["CLOUDINARY_API_KEY"],
                      os.environ["CLOUDINARY_API_SECRET"],
                  ),
                  data={
                      "folder": "ai-pintar",
                      "public_id": f"ai-pintar-{os.environ['GITHUB_RUN_NUMBER']}",
                      "overwrite": "true",
                  },
                  files={"file": (video_path.name, file, "video/mp4")},
                  timeout=900,
              )
          upload.raise_for_status()
          video_url = upload.json().get("secure_url")
          if not video_url:
              sys.exit("Cloudinary tidak mengembalikan secure_url.")

          # Buffer GraphQL.
          headers = {
              "Authorization": "Bearer " + os.environ["BUFFER_ACCESS_TOKEN"],
              "Content-Type": "application/json",
          }

          def gql(query):
              response = requests.post(
                  "https://api.buffer.com",
                  headers=headers,
                  json={"query": query},
                  timeout=60,
              )
              response.raise_for_status()
              body = response.json()
              if body.get("errors"):
                  raise RuntimeError(json.dumps(body["errors"], ensure_ascii=False))
              return body.get("data", {})

          account = gql("query { account { organizations { id name } } }")
          organizations = account.get("account", {}).get("organizations", [])
          if not organizations:
              sys.exit("Organisasi Buffer tidak ditemukan.")
          organization_id = organizations[0]["id"]

          channels_query = (
              "query { channels(input: { organizationId: "
              + json.dumps(organization_id)
              + " }) { id name displayName service } }"
          )
          channels = gql(channels_query).get("channels", [])

          # Jadwalkan video yang sama ke Facebook dan TikTok.
          # Setiap channel memakai slot antreannya sendiri di Buffer.
          facebook = next(
              (c for c in channels if (c.get("service") or "").lower() == "facebook"),
              None,
          )
          tiktok = next(
              (c for c in channels if (c.get("service") or "").lower() == "tiktok"),
              None,
          )

          missing = []
          if facebook is None:
              missing.append("Facebook")
          if tiktok is None:
              missing.append("TikTok")
          if missing:
              available = [
                  {
                      "name": c.get("displayName") or c.get("name"),
                      "service": c.get("service"),
                  }
                  for c in channels
              ]
              sys.exit(
                  "Channel tidak ditemukan: " + ", ".join(missing)
                  + ". Channel tersedia: "
                  + json.dumps(available, ensure_ascii=False)
              )

          def create_video_post(channel, service):
              if service == "facebook":
                  metadata = "metadata: { facebook: { type: post } }"
              else:
                  # Disclosure AI untuk video yang dibuat dengan bantuan AI.
                  metadata = "metadata: { tiktok: { isAiGenerated: true } }"

              mutation = f"""
              mutation {{
                createPost(input: {{
                  text: {json.dumps(caption, ensure_ascii=False)}
                  channelId: {json.dumps(channel["id"])}
                  schedulingType: automatic
                  mode: addToQueue
                  {metadata}
                  assets: [{{
                    video: {{
                      url: {json.dumps(video_url)}
                      metadata: {{ thumbnailOffset: 1000 }}
                    }}
                  }}]
                }}) {{
                  ... on PostActionSuccess {{ post {{ id dueAt status }} }}
                  ... on MutationError {{ message }}
                }}
              }}
              """
              result = gql(mutation).get("createPost", {})
              if result.get("message") or not result.get("post"):
                  raise RuntimeError(
                      f"Buffer {service} gagal: "
                      + json.dumps(result, ensure_ascii=False)
                  )
              post = result["post"]
              print(
                  f"BUFFER {service.upper()} OK: "
                  f"id={post.get('id')} dueAt={post.get('dueAt')} "
                  f"status={post.get('status')}"
              )

          # Satu per satu agar log mudah diperiksa jika ada kegagalan.
          create_video_post(facebook, "facebook")
          create_video_post(tiktok, "tiktok")

          print(
              "SELESAI: video masuk antrean Facebook dan TikTok Buffer. "
              "Jam publikasi mengikuti slot antrean masing-masing channel."
          )
          PY
