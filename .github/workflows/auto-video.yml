
name: AI PINTAR Auto Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Pasang library Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan mesin pembuat video
        run: |
          python main.py
          test -f output/ai_pintar_video.mp4

      - name: Simpan hasil video MP4
        uses: actions/upload-artifact@v4
        with:
          name: AI-PINTAR-Video
          path: output/ai_pintar_video.mp4
          if-no-files-found: error
          retention-days: 7
