name: AI PINTAR 2.0 Staging Safety Test

on:
  pull_request:
    branches:
      - ai-pintar-2-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-pintar-staging-safe-test
  cancel-in-progress: false

jobs:
  offline-safety-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging repair branch
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run synthetic offline video pipeline
        run: python run_offline_pipeline.py

      - name: Upload offline test artifact
        uses: actions/upload-artifact@v6
        with:
          name: AI-PINTAR-STAGING-OFFLINE
          path: |
            output_offline/final_video.mp4
            output_offline/caption.txt
            output_offline/subtitles.srt
            output_offline/manifest.json
            output_offline/script.txt
          if-no-files-found: error
          retention-days: 7
