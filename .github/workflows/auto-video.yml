name: AI PINTAR 2.0 Staging Safety Test

on:
  pull_request:
    branches:
      - ai-pintar-2-staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-pintar-staging-safe-test
  cancel-in-progress: false

jobs:
  offline-safety-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate hashed dependency lock and install
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools==7.5.2
          pip-compile --generate-hashes --output-file=requirements.lock requirements.in
          echo LOCK_START
          cat requirements.lock
          echo LOCK_END
          pip install --require-hashes -r requirements.lock

      - name: Compile Python sources
        run: python -m compileall -q engine tests run_production.py run_offline_pipeline.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run synthetic offline video pipeline
        run: python run_offline_pipeline.py

      - name: Upload offline test artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: AI-PINTAR-STAGING-OFFLINE
          path: |
            output_offline/final_video.mp4
            output_offline/caption.txt
            output_offline/subtitles.srt
            output_offline/subtitles.ass
            output_offline/manifest.json
            output_offline/script.txt
            output_offline/cover.jpg
            output_offline/presenter_master.png
          if-no-files-found: error
          retention-days: 7
